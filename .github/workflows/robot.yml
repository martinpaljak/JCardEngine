name: Build robot

on:
  workflow_dispatch:
  push:
    branches:
      - next
      - wip
    tags:
      - 'v*'

concurrency:
  group: robot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the release step attaches the jar
    strategy:
      matrix:
        java: [ 17, 21, 25 ]
    name: Java ${{ matrix.java }} build
    env:
      PUBLISH: ${{ matrix.java == '17' && ( github.ref == 'refs/heads/next' || startsWith(github.ref, 'refs/tags/v') ) }}
      RELEASE: ${{ matrix.java == '17' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: zulu
      - name: Maven cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-java${{ matrix.java }}-${{ hashFiles('**/pom.xml', '.mvn/**') }}
          restore-keys: maven-java${{ matrix.java }}-
      - name: Set up publishing
        if: env.PUBLISH == 'true'
        uses: martinpaljak/maven-ssh-deploy@v2
        with:
          host: mvn.javacard.pro
          key: ${{ secrets.SSH_KEY }}
          fingerprint: SHA256:auiF3nHWvDmvq2stDl+QEECCqMcDp+FY1/bDRnvxpRw
      - name: Build and deploy
        run: ./mvnw -B -U deploy -Dmaven.deploy.skip=${{ env.PUBLISH != 'true' }}
      - name: Upload
        if: matrix.java == '17'
        uses: actions/upload-artifact@v7
        with:
          path: ./tool/target/jcard.jar
          archive: false
      - name: Release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v3.0.3
        with:
          prerelease: true # manually promoted
          files: ./tool/target/jcard.jar
          fail_on_unmatched_files: true
          body: Release ${{ github.ref_name }}

  windows:
    runs-on: windows-2025
    name: Windows
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: zulu
          cache: maven
      - name: Build and test
        run: .\mvnw.cmd -B -U
